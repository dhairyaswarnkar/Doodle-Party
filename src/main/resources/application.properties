spring.application.name=doodle-party
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.storage-directory=${GAME_STORAGE_DIRECTORY:./data/rooms}
app.access-password=${GAME_ACCESS_PASSWORD:}
app.private-mode=${GAME_PRIVATE_MODE:false}
spring.jackson.default-property-inclusion=always
